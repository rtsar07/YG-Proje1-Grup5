<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkileşimli Ders Deneyimi Panosu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Üst Bilgi ve Tema Değiştirici -->
        <header>
            <h1>📚 Etkileşimli Ders Panosu</h1>
            <button id="theme-toggle" class="btn-theme">🌓 Tema Değiştir</button>
        </header>

        <!-- İlerleme Çubuğu (Progress Bar) -->
        <section class="progress-section">
            <div class="progress-info">
                <span>Genel İlerleme</span>
                <span id="progress-text">%0 Tamamlandı</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </section>

        <!-- Arama ve Filtreleme Alanı -->
        <section class="filter-section">
            <input type="text" id="search-input" placeholder="🔍 Görev veya içerik ara...">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Tümü</button>
                <button class="filter-btn" data-filter="active">Devam Edenler</button>
                <button class="filter-btn" data-filter="completed">Tamamlananlar</button>
            </div>
        </section>

        <!-- Haftalık Ders Kartları Listesi -->
        <main id="weeks-container">
            <!-- JavaScript ile dinamik olarak doldurulacak -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
